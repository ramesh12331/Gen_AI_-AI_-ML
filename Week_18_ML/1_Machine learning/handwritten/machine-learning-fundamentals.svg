<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500">
 <defs><pattern id="lines" width="1200" height="42" patternUnits="userSpaceOnUse"><line x1="0" y1="41" x2="1200" y2="41" stroke="#d4e2ef" stroke-width="1.5"/></pattern></defs>
 <rect width="1200" height="1500" rx="25" fill="#fffdf6"/><rect width="1200" height="1500" rx="25" fill="url(#lines)"/>
 <line x1="52" y1="0" x2="52" y2="1500" stroke="#e9a6aa" stroke-width="3"/>
 <text x="88" y="95" font-family="Comic Sans MS,Segoe Print,cursive" font-size="48" font-weight="700" fill="#1e365a">Machine Learning Fundamentals</text>
 <path d="M90 116 Q450 130 1030 112" stroke="#315e9b" stroke-width="6" fill="none" stroke-linecap="round"/>
 <text x="92" y="165" font-family="Comic Sans MS,Segoe Print,cursive" font-size="25" fill="#7b4a52">Beginner concept map • Inputs → learning → predictions</text>
 <g font-family="Comic Sans MS,Segoe Print,cursive"><g><rect x="72" y="205" width="1056" height="210" rx="24" fill="#fff8df" stroke="#315e9b" stroke-opacity=".5" stroke-width="2"/>
  <text x="112" y="260" font-size="34" font-weight="700" fill="#315e9b">1. What is Machine Learning?</text><text x="122" y="311" font-size="27" fill="#27364b">Computer learns patterns from examples instead of receiving every rule by hand.</text><text x="122" y="353" font-size="27" fill="#27364b">DATA → ALGORITHM → LEARNED MODEL → PREDICTION</text></g><g><rect x="72" y="439" width="1056" height="245" rx="24" fill="#eaf5ff" stroke="#315e9b" stroke-opacity=".5" stroke-width="2"/>
  <text x="112" y="494" font-size="34" font-weight="700" fill="#315e9b">2. Three learning styles</text><text x="122" y="545" font-size="27" fill="#27364b">SUPERVISED: examples include correct answers (labels).</text><text x="122" y="587" font-size="27" fill="#27364b">UNSUPERVISED: discover groups or patterns without labels.</text><text x="122" y="629" font-size="27" fill="#27364b">REINFORCEMENT: learn actions from rewards and penalties.</text></g><g><rect x="72" y="708" width="1056" height="210" rx="24" fill="#eff9ed" stroke="#315e9b" stroke-opacity=".5" stroke-width="2"/>
  <text x="112" y="763" font-size="34" font-weight="700" fill="#315e9b">3. Two supervised tasks</text><text x="122" y="814" font-size="27" fill="#27364b">REGRESSION → predict a number (salary, house price, marks).</text><text x="122" y="856" font-size="27" fill="#27364b">CLASSIFICATION → predict a category (spam/not spam, pass/fail).</text></g><g><rect x="72" y="942" width="1056" height="210" rx="24" fill="#fff0f2" stroke="#315e9b" stroke-opacity=".5" stroke-width="2"/>
  <text x="112" y="997" font-size="34" font-weight="700" fill="#315e9b">4. Model learning loop</text><text x="122" y="1048" font-size="27" fill="#27364b">Collect data → prepare data → train → evaluate → predict.</text><text x="122" y="1090" font-size="27" fill="#27364b">Check performance on unseen test data; aim for generalization.</text></g></g>
 <text x="90" y="1460" font-family="Comic Sans MS,Segoe Print,cursive" font-size="22" fill="#64748b">Beginner revision sheet • Read the chapter for full explanations and Python practice</text>
 </svg>