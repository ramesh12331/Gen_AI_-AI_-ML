<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">Handwritten Multiple Linear Regression Notes</title>
  <desc id="desc">A notebook-style handwritten study sheet covering the multiple linear regression equation, residual, OLS objective, matrix form, and normal equation.</desc>
  <defs>
    <pattern id="paperLines" width="1200" height="42" patternUnits="userSpaceOnUse">
      <line x1="0" y1="41" x2="1200" y2="41" stroke="#cfe2f3" stroke-width="1.5"/>
    </pattern>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#8aa0b5" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="1200" height="1500" rx="22" fill="#fffdf5"/>
  <rect width="1200" height="1500" rx="22" fill="url(#paperLines)"/>
  <line x1="105" y1="0" x2="105" y2="1500" stroke="#f0a4a4" stroke-width="3"/>
  <g font-family="'Comic Sans MS','Segoe Print','Bradley Hand',cursive" fill="#203c69">
    <text x="150" y="90" font-size="48" font-weight="700" transform="rotate(-1 150 90)">Multiple Linear Regression</text>
    <path d="M150 108 Q480 120 850 105" fill="none" stroke="#e56b6f" stroke-width="5" stroke-linecap="round"/>
    <text x="155" y="155" font-size="25" fill="#a34b4b">Machine Learning • Quick handwritten revision</text>

    <g filter="url(#softShadow)">
      <rect x="145" y="195" width="970" height="190" rx="18" fill="#fff9d9" stroke="#e4c65d" stroke-width="2"/>
    </g>
    <text x="180" y="245" font-size="32" font-weight="700" fill="#a65b22">1. Main idea</text>
    <text x="185" y="292" font-size="29">Use 2 or more input features (X) to predict one target (y).</text>
    <text x="185" y="342" font-size="35" font-weight="700">ŷ = β₀ + β₁X₁ + β₂X₂ + ... + βₙXₙ</text>

    <g filter="url(#softShadow)">
      <rect x="145" y="415" width="970" height="205" rx="18" fill="#eaf6ff" stroke="#80b9e8" stroke-width="2"/>
    </g>
    <text x="180" y="465" font-size="32" font-weight="700" fill="#24689c">2. What do the symbols mean?</text>
    <text x="190" y="510" font-size="27">ŷ  = predicted value</text>
    <text x="190" y="550" font-size="27">β₀ = intercept</text>
    <text x="190" y="590" font-size="27">β₁, β₂, ... = learned coefficients • X₁, X₂, ... = input features</text>

    <g filter="url(#softShadow)">
      <rect x="145" y="650" width="970" height="195" rx="18" fill="#f1fbe9" stroke="#a5cf83" stroke-width="2"/>
    </g>
    <text x="180" y="700" font-size="32" font-weight="700" fill="#39783b">3. Residual and OLS</text>
    <text x="190" y="748" font-size="31">Residual:  eᵢ = yᵢ − ŷᵢ</text>
    <text x="190" y="795" font-size="31">SSE = Σ (yᵢ − ŷᵢ)²</text>
    <text x="190" y="827" font-size="23" fill="#39783b">OLS chooses coefficients to minimize the sum of squared residuals.</text>

    <g filter="url(#softShadow)">
      <rect x="145" y="875" width="970" height="205" rx="18" fill="#fff0f1" stroke="#e8a0a6" stroke-width="2"/>
    </g>
    <text x="180" y="925" font-size="32" font-weight="700" fill="#ad4c61">4. Matrix form</text>
    <text x="190" y="975" font-size="34">ŷ = Xβ</text>
    <text x="190" y="1020" font-size="27">X = feature/design matrix • β = coefficient vector</text>
    <text x="190" y="1055" font-size="27">y = actual target values • Xᵀ = transpose of X</text>

    <g filter="url(#softShadow)">
      <rect x="145" y="1110" width="970" height="225" rx="18" fill="#f2edff" stroke="#b5a0e7" stroke-width="2"/>
    </g>
    <text x="180" y="1160" font-size="32" font-weight="700" fill="#6947a5">5. The Normal Equation ⭐</text>
    <text x="190" y="1225" font-size="40" font-weight="700">β̂ = (XᵀX)⁻¹ Xᵀy</text>
    <text x="190" y="1275" font-size="25">It estimates the coefficients when XᵀX is invertible.</text>
    <text x="190" y="1312" font-size="23" fill="#6947a5">In practice, numerical solvers or a pseudoinverse can be safer.</text>

    <text x="150" y="1390" font-size="28" font-weight="700" fill="#a34b4b">Remember:</text>
    <text x="315" y="1390" font-size="26">Features → coefficients → predictions → evaluate errors</text>
    <text x="150" y="1440" font-size="21" fill="#6b7c93">Study note • Multiple Linear Regression • GitHub learning repository</text>
  </g>
</svg>