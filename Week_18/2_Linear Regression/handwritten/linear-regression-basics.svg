<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500">
 <defs><pattern id="lines" width="1200" height="42" patternUnits="userSpaceOnUse"><line x1="0" y1="41" x2="1200" y2="41" stroke="#d4e2ef" stroke-width="1.5"/></pattern></defs>
 <rect width="1200" height="1500" rx="25" fill="#fffdf6"/><rect width="1200" height="1500" rx="25" fill="url(#lines)"/>
 <line x1="52" y1="0" x2="52" y2="1500" stroke="#e9a6aa" stroke-width="3"/>
 <text x="88" y="95" font-family="Comic Sans MS,Segoe Print,cursive" font-size="48" font-weight="700" fill="#1e365a">Linear Regression</text>
 <path d="M90 116 Q450 130 1030 112" stroke="#247b69" stroke-width="6" fill="none" stroke-linecap="round"/>
 <text x="92" y="165" font-family="Comic Sans MS,Segoe Print,cursive" font-size="25" fill="#7b4a52">Beginner concept map • Finding a line that predicts a number</text>
 <g font-family="Comic Sans MS,Segoe Print,cursive"><g><rect x="72" y="205" width="1056" height="210" rx="24" fill="#fff8df" stroke="#247b69" stroke-opacity=".5" stroke-width="2"/>
  <text x="112" y="260" font-size="34" font-weight="700" fill="#247b69">1. What is Linear Regression?</text><text x="122" y="311" font-size="27" fill="#27364b">A supervised learning method that predicts a numerical value from input data.</text><text x="122" y="353" font-size="27" fill="#27364b">Example: house area → estimated house price.</text></g><g><rect x="72" y="439" width="1056" height="245" rx="24" fill="#eaf5ff" stroke="#247b69" stroke-opacity=".5" stroke-width="2"/>
  <text x="112" y="494" font-size="34" font-weight="700" fill="#247b69">2. The straight-line model</text><text x="122" y="545" font-size="27" fill="#27364b">ŷ = mx + c</text><text x="122" y="587" font-size="27" fill="#27364b">x = input feature • ŷ = predicted output • m = slope • c = intercept.</text></g><g><rect x="72" y="708" width="1056" height="210" rx="24" fill="#eff9ed" stroke="#247b69" stroke-opacity=".5" stroke-width="2"/>
  <text x="112" y="763" font-size="34" font-weight="700" fill="#247b69">3. Best-fit line</text><text x="122" y="814" font-size="27" fill="#27364b">The line summarizes the relationship between the input x and output y.</text><text x="122" y="856" font-size="27" fill="#27364b">Ordinary least squares chooses the line that minimizes squared residuals.</text></g><g><rect x="72" y="942" width="1056" height="210" rx="24" fill="#fff0f2" stroke="#247b69" stroke-opacity=".5" stroke-width="2"/>
  <text x="112" y="997" font-size="34" font-weight="700" fill="#247b69">4. How prediction works</text><text x="122" y="1048" font-size="27" fill="#27364b">Give a new x value → substitute into the learned equation → calculate ŷ.</text><text x="122" y="1090" font-size="27" fill="#27364b">A model learns m and c from training examples.</text></g></g>
 <text x="90" y="1460" font-family="Comic Sans MS,Segoe Print,cursive" font-size="22" fill="#64748b">Beginner revision sheet • Read the chapter for full explanations and Python practice</text>
 </svg>